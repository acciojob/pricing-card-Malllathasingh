
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Card</title>

    <style>
        .card {
            width: 300px;
            padding: 20px;
            background-color: white;
            box-shadow: 0px 4px 10px gray;
            text-align: center;
            margin: 50px auto;
        }

        .card img {
            width: 100%;
        }

        .card h1 {
            font-size: 25px;
        }

        .card p {
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="https://storage.googleapis.com/acciojob-open-file-collections/pricing-card.png" alt="Product Image">

        <h1>Premium Plan</h1>

        <p>Price: ₹999</p>

        <p>Get access to all premium features and enjoy unlimited benefits.</p>

        <button>Buy Now</button>

    </div>

</body>
</html>
